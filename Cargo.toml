[workspace]
resolver = "3"
members = [
    "apps/api",
    "apps/cli",
    "crates/core",
    "crates/repository",
    "crates/intelligence",
    "crates/integration",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
composer-core = { path = "crates/core" }
composer-repository = { path = "crates/repository" }
composer-intelligence = { path = "crates/intelligence" }
composer-integration = { path = "crates/integration" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.9"
uuid = { version = "1", features = ["v4", "serde"] }
