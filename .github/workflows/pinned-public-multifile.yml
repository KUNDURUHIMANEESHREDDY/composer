name: Pinned public Rust multi-file benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pinned-multifile-realworld-benchmark
      - feat/compiler-gated-api-signatures-and-cargo-features
      - feat/readonly-rust-api-contract-discovery
    paths:
      - .github/workflows/pinned-public-multifile.yml
      - tests/test_pinned_public_multifile.py
      - tests/test_rust_api_discovery_public.py
      - crates/integration/src/api_discovery.rs

permissions:
  contents: read

jobs:
  pinned-public-multifile:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Composer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned upstream
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned upstream
      - name: Prepare restricted Docker verification image
        run: bash scripts/prefetch-pinned-rust-verifier.sh
      - name: Validate pinned public multi-file source against existing targets
        run: python3 tests/test_pinned_public_multifile.py
      - name: Test read-only Rust API discovery on five pinned public source repos
        run: python3 tests/test_rust_api_discovery_public.py
