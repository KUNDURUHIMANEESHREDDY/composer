name: External Cargo-backed discovery and reuse

on:
  pull_request:
    paths:
      - .github/workflows/external-discovery.yml
      - tests/test_external_discovery_public.py
      - crates/integration/**
      - apps/cli/**
  push:
    branches:
      - feat/cargo-upstream-discovery
    paths:
      - .github/workflows/external-discovery.yml
      - tests/test_external_discovery_public.py
      - crates/integration/**
      - apps/cli/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-discovery:
    # No fork-submitted code is evaluated by Docker.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned offline verifier
        run: docker pull rust:1.99-slim
      - name: Discover external repos and verify real functionality in unrelated public target
        run: python3 -u tests/test_external_discovery_public.py
