name: Repeated reviewed Rust API integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/reviewed-api-verified-execution
    paths:
      - .github/workflows/reviewed-api-repeated.yml
      - tests/test_reviewed_api_repeated_public.py
      - crates/integration/src/reviewed.rs
      - crates/integration/src/verified.rs

permissions:
  contents: read

jobs:
  reviewed-api-repeatability:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed feature branch
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare restricted Rust verifier image
        run: docker pull rust:1.99-slim
      - name: Verify repeated reviewed API transfers against pinned public targets
        run: python3 tests/test_reviewed_api_repeated_public.py
