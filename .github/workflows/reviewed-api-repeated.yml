name: Repeated reviewed Rust API integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/reviewed-api-verified-execution
      - feat/semantic-contract-admission
    paths:
      - .github/workflows/reviewed-api-repeated.yml
      - tests/test_reviewed_api_repeated_public.py
      - tests/reviewed_api_property_vectors.py
      - crates/integration/src/reviewed.rs
      - crates/integration/src/verified.rs

permissions:
  contents: read

jobs:
  reviewed-api-repeatability:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed feature branch
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare restricted Rust verifier image
        run: docker pull rust:1.99-slim
      - name: Install upstream Hypothesis for deterministic independent property vectors
        run: |
          python3 -m venv .composer-contract-venv
          .composer-contract-venv/bin/pip install --disable-pip-version-check hypothesis==6.170.17
      - name: Verify repeated reviewed API transfers against pinned public targets
        run: .composer-contract-venv/bin/python tests/test_reviewed_api_repeated_public.py
