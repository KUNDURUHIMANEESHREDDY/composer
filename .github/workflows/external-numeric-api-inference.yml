name: Inferred numeric-output API from independent GitHub source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/external-numeric-api-inference.yml
      - crates/integration/src/api_discovery.rs
      - crates/integration/src/reviewed_upstream_adapter.rs
      - tests/test_pinned_git_numeric_api_inference.py

permissions:
  contents: read

jobs:
  external-numeric-api:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned upstream
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned upstream
      - name: Pull existing non-root isolated Rust image
        run: bash scripts/prefetch-pinned-rust-verifier.sh
      - name: Import published-independent source pinned by exact Git SHA and infer scalar API
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/test_pinned_git_numeric_api_inference.py 2>&1 | tee external-numeric-api-evidence.log
      - name: Retain success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upstream
        with:
          name: external-numeric-api-inference-evidence
          path: external-numeric-api-evidence.log
          if-no-files-found: warn
