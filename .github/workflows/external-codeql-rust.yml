name: External CodeQL Rust security analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '13 2 * * 1'
  pull_request:
    paths:
      - .github/workflows/external-codeql-rust.yml
      - crates/**
      - apps/**
      - Cargo.lock
      - Cargo.toml
      - scripts/**
      - tests/**

permissions:
  contents: read

jobs:
  codeql-rust:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out exact PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize established third-party CodeQL Rust analyzer
        uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze Rust source without running third-party build scripts
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        with:
          category: /language:rust
          output: codeql-rust-raw
          post-processed-sarif-path: codeql-rust-findings
      - name: Fail on unreviewed security findings from the independent scanner
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          files = sorted(pathlib.Path("codeql-rust-findings").rglob("*.sarif"))
          if not files:
              raise SystemExit("CodeQL produced no reviewable SARIF; refusing release acceptance")
          total = 0
          for file in files:
              data = json.loads(file.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  findings = [r for r in run.get("results", []) if not r.get("suppressions")]
                  for result in findings[:30]:
                      print("UNREVIEWED_CODEQL_FINDING", result.get("ruleId"), result.get("level"))
                  total += len(findings)
          print("CODEQL_SARIF_FILES", len(files))
          print("UNREVIEWED_CODEQL_FINDINGS", total)
          if total:
              sys.exit(1)
          PY
      - name: Retain original external scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-codeql-rust-sarif
          path: |
            codeql-rust-raw/
            codeql-rust-findings/
          if-no-files-found: warn
