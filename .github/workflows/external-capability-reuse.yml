name: External open-source capability reuse acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/external-capability-reuse.yml
      - tests/test_external_luhn_public.py
      - crates/integration/src/**
      - crates/intelligence/src/**

permissions:
  contents: read

jobs:
  external-upstream-transfer:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate Composer changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - name: Fetch restricted Docker verifier image
        run: bash scripts/prefetch-pinned-rust-verifier.sh
      - name: Transfer pinned upstream Luhn code, verify actual behavior, and reject wrong contracts
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/test_external_luhn_public.py 2>&1 | tee external-luhn-evidence.log
      - name: Preserve failure and success evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-luhn-reuse-log
          path: external-luhn-evidence.log
          if-no-files-found: warn
