name: OpenSSF Scorecard upstream trust review

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 1'
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ossf-scorecard.yml

permissions:
  contents: read

jobs:
  scorecard:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code without persisting access credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run pinned official OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Retain scorecard findings for reviewer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: composer-ossf-scorecard-evidence
          path: scorecard-results.sarif
          if-no-files-found: error
