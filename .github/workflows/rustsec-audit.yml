name: RustSec dependency vulnerability audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

# Only reads lockfile/advisory data. No repository write or secrets needed.
permissions:
  contents: read

jobs:
  rustsec-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install upstream RustSec cargo-audit with checksum validation
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83
        with:
          tool: cargo-audit@0.23.0
          fallback: none
      - name: Audit lockfile from outside the untrusted checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock"
