name: Unpublished Git-only upstream acceptance

on:
  pull_request:
    paths:
      - .github/workflows/unpublished-git-windows.yml
      - tests/test_unpublished_git_public.py
      - crates/integration/**
      - apps/cli/**
  push:
    branches:
      - feat/unpublished-git-windows-acceptance
    paths:
      - .github/workflows/unpublished-git-windows.yml
      - tests/test_unpublished_git_public.py
      - crates/integration/**
      - apps/cli/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-unpublished-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare existing offline verifier
        run: docker pull rust:1.99-slim
      - name: Verify truly unpublished Git-only code in independent target
        run: python3 -u tests/test_unpublished_git_public.py

  windows-compiler-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Windows Rust compiler
        uses: dtolnay/rust-toolchain@stable
      - name: Verify Windows Rust format
        run: cargo fmt --all -- --check
      - name: Resolve Windows-specific Cargo lockfile changes
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Cargo could not resolve Windows dependencies" }
          if (git diff --quiet -- Cargo.lock) {
            Write-Output "PASS committed Cargo.lock works unchanged on Windows"
          } else {
            Write-Output "::warning::Committed Cargo.lock requires Windows-specific resolution; native install reproducibility from the original lock remains open"
            git diff --stat -- Cargo.lock
          }
      - name: Verify workspace unit tests from clean Windows runner with resolved lockfile
        run: cargo test --workspace --all-targets --locked
      - name: Verify CLI supports both external import commands on Windows
        shell: pwsh
        run: |
          cargo run -p composer-cli --locked -- --help | Out-File -Encoding utf8 cli-help.txt
          $help = Get-Content cli-help.txt -Raw
          if (-not $help.Contains("verify-external-git-rust") -or -not $help.Contains("discover-external-rust")) {
            throw "Windows CLI missing external dependency reuse commands"
          }
          Write-Output "PASS Windows native Composer CLI and Rust unit regression"
