name: Held-out third-party API adaptation acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/heldout-string-adapter.yml
      - crates/integration/src/upstream_crate.rs
      - apps/cli/src/auto_external.rs
      - apps/cli/src/main.rs
      - examples/approved-external-capabilities.json
      - tests/test_unseen_owned_string_adaptation.py

permissions:
  contents: read

jobs:
  external-reviewed-api-adapter:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Composer
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare existing isolated verifier image
        run: docker pull rust:1.99-slim
      - name: Verify independent published transliteration source into held-out target
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/test_unseen_owned_string_adaptation.py 2>&1 | tee heldout-string-adapter-evidence.log
      - name: Preserve behavioral and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-string-adapter-evidence
          path: heldout-string-adapter-evidence.log
          if-no-files-found: warn
