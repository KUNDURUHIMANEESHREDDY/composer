name: Automatic reviewed external capability selection acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/auto-reviewed-external.yml
      - apps/cli/src/auto_external.rs
      - apps/cli/src/main.rs
      - examples/approved-external-capabilities.json
      - tests/test_auto_external_composition_public.py
      - crates/integration/src/upstream_crate.rs

permissions:
  contents: read

jobs:
  approved-external:
    if: github.repository == 'KUNDURUHIMANEESHREDDY/composer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Composer
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Pull isolated Docker verifier
        run: docker pull rust:1.99-slim
      - name: Automatic selection and verified import from independent third-party projects
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/test_auto_external_composition_public.py 2>&1 | tee auto-external-evidence.log
      - name: Retain evidence even if verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-reviewed-external-evidence
          path: auto-external-evidence.log
          if-no-files-found: warn
