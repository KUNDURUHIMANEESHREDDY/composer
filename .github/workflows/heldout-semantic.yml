name: Held-out Rust semantic integration acceptance

on:
  pull_request:
    paths:
      - .github/workflows/heldout-semantic.yml
      - tests/test_heldout_semantic_benchmark.py
      - crates/integration/**
      - apps/cli/**
  push:
    branches: [main]
    paths:
      - .github/workflows/heldout-semantic.yml
      - tests/test_heldout_semantic_benchmark.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout-semantic:
    # Do not run untrusted fork PR code with the Docker verifier.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned upstream
      - name: Install Rust and Python
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned upstream
      - name: Prepare pinned offline verifier image
        run: bash scripts/prefetch-pinned-rust-verifier.sh
      - name: Execute held-out public integration and negative controls
        run: python3 -u tests/test_heldout_semantic_benchmark.py
