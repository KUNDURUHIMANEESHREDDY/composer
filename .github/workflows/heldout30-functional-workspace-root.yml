name: Frozen Cargo workspace root-package functional verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/heldout30-functional-workspace-root.yml
      - tests/test_heldout30_functional_anyhow.py
      - tests/test_heldout30_functional_workspace_root.py
      - tests/heldout30_pins.json
      - crates/integration/**
      - Cargo.lock

permissions:
  contents: read

jobs:
  root-package:
    name: ${{ matrix.case }} / root-package all_targets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: regex
            features: default
            toolchain: stable
            repository: rust-lang/regex
          - case: rayon
            features: default
            toolchain: stable
            repository: rayon-rs/rayon
          - case: http
            features: default
            toolchain: stable
            repository: hyperium/http
          - case: clap
            features: default
            toolchain: stable
            repository: clap-rs/clap
          - case: indexmap
            features: default
            toolchain: nightly-2026-11-25
            repository: bluss/indexmap
          - case: walkdir
            features: default
            toolchain: stable
            repository: BurntSushi/walkdir
          - case: syn
            features: all
            toolchain: nightly-rustc-dev-2026-11-25
            repository: dtolnay/syn
          - case: uuid
            features: default
            toolchain: nightly-gungraun-0.20.0
            repository: uuid-rs/uuid
          - case: crossbeam
            features: default
            toolchain: stable
            repository: crossbeam-rs/crossbeam
          - case: thiserror
            features: default
            toolchain: stable
            repository: dtolnay/thiserror
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned upstream
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned upstream
      - name: Preload digest-pinned stable Docker verifier
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.toolchain }}' in
            stable) bash scripts/prefetch-pinned-rust-verifier.sh ;;
            nightly-2026-11-25)
              docker pull --platform=linux/amd64 docker.io/rustlang/rust@sha256:eb59a92b7f3abf22b62141998ad2f2b477425ccd2f796a1dd87e79bc78beccab ;;
            nightly-gungraun-0.20.0|nightly-rustc-dev-2026-11-25)
              bash scripts/prefetch-extended-rust-verifier.sh '${{ matrix.toolchain }}' ;;
            *) exit 1 ;;
          esac
      - name: Test root package three times and reject wrong implementation
        shell: bash
        env:
          COMPOSER_VERIFIER_MEMORY_MB: '4096'
          COMPOSER_VERIFIER_TOOLCHAIN: ${{ matrix.toolchain }}
          COMPOSER_VERIFIER_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          python3 -u tests/test_heldout30_functional_workspace_root.py \
            --target-case ${{ matrix.case }} 2>&1 | tee heldout-workspace-root.log
          grep -q 'PASS held-out target ${{ matrix.repository }} functional trial 3/3' heldout-workspace-root.log
          grep -q '"verification_scope": "all_targets"' heldout-workspace-root.log
          grep -q 'PASS wrong-function control rejected, no publication' heldout-workspace-root.log
          grep -q 'EVIDENCE_JSON ' heldout-workspace-root.log
      - name: Retain per-repository evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upstream
        with:
          name: composer-heldout-workspace-root-${{ matrix.case }}
          path: heldout-workspace-root.log
          if-no-files-found: warn
          retention-days: 14
