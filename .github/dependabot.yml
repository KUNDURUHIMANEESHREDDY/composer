# Direct-main workflow: disable automated Dependabot version-update pull requests.
# Existing independent RustSec, OSV, CodeQL and cargo-deny scans remain enabled.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:45"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
